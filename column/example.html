<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Column mold — example</title>
<link rel="stylesheet" href="col-shell.css">
<style>
  /* Your theme goes here: override the color tokens, never the skeleton. */
  :root{ --ink:#fdf8ee; --beam:#c2410c; }
  #q{ margin:auto;font-size:calc(16cqw*var(--ts));font-family:var(--num);color:var(--chalk); }
  .chips{ grid-template-columns:1fr 1fr; }
  .chips button{ font-size:max(20px,8cqw);font-family:var(--num); }
</style>
</head>
<body>
<div id="app">
  <div id="left"></div>
  <div id="col">
    <div id="status"><span class="brand">Quick Sums</span><span id="stats">score <b id="score">0</b> · streak <b id="streak">0</b></span></div>
    <div id="board"><div id="q">3 + 4</div></div>
    <div id="play"><div class="chips" id="chips"></div></div>
    <div id="hint">One mistake ends the run.</div>
    <div id="card" hidden><div class="sheet">
      <h2>Run over</h2><div class="sub">You answered <b id="hits">0</b> in a row.</div>
      <button id="cardGo">Again</button>
    </div></div>
  </div>
  <div id="right"></div>
</div>
<script src="col-shell.js"></script>
<script src="../rules/rules-kit.js"></script>
<script>
  const col = initCol({
    config: { vf: 0.38, gutter: 12 },
    move: [ { id: 'stats', wide: 'right', home: 'status' }, { id: 'hint', wide: 'left', home: 'col' } ],
  });
  const $ = id => document.getElementById(id);
  let answer = 0;
  const run = makeRun({ lives: 1, k: 1, d0: .10, decay: .9, dMin: .02,
    onOver: r => { $('hits').textContent = r.hits; $('card').hidden = false; } });
  function next(){
    const a = 1 + Math.random() * 9 | 0, b = 1 + Math.random() * 9 | 0; answer = a + b;
    $('q').textContent = a + ' + ' + b;
    const opts = new Set([answer]); while (opts.size < 4) opts.add(answer + (Math.random() * 7 | 0) - 3);
    $('chips').innerHTML = [...opts].sort(() => Math.random() - .5).map(n => `<button>${n}</button>`).join('');
  }
  $('chips').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const s = +b.textContent === answer ? run.hit() : run.miss();
    $('score').textContent = s.score; $('streak').textContent = s.streak;
    if (!s.over) next();
  };
  $('cardGo').onclick = () => { $('card').hidden = true; run.start(); $('score').textContent = $('streak').textContent = 0; next(); };
  run.start(); next();
</script>
</body>
</html>
